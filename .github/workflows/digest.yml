name: Digest (every other day)

# GitHub's schedule trigger is UTC-only (no DST awareness) and, in practice,
# best-effort — it can run significantly later than the time configured, not
# just a few minutes late. Both problems get solved the same way: don't gate
# on "is it exactly noon Eastern right now" (which a delay of even an hour
# breaks entirely — confirmed in production on 2026-09-14, both triggers
# fired ~4-5 hours late and the digest silently never sent that day). Instead
# gate on "has today's Eastern date already been sent" — robust to any delay,
# and still prevents a double-send on days where both seasonal triggers below
# end up landing close together.
on:
  schedule:
    - cron: "0 12 * * *" # UTC Time (mid-Mar -> early Nov)
    - cron: "0 13 * * *" # UTC Time (early Nov -> mid-Mar)
  workflow_dispatch: {} # manual "Run workflow" button — always sends, regardless of the guard

permissions:
  contents: write # needed to commit data/ back after each real run

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cron runs every day; this gate makes it every OTHER day by skipping
      # unless 2+ Eastern calendar days have passed since the last send. That
      # also covers the double-trigger days (diff 0) and self-heals if a run is
      # dropped (the next day sees diff 3 and runs). A manual run resets the
      # clock, since it writes last-sent.txt too.
      - name: Only send every other Eastern calendar day
        id: gate
        run: |
          today=$(TZ="America/New_York" date +%F)
          last=$(cat data/last-sent.txt 2>/dev/null || echo "never")
          if [ "$last" = "never" ]; then
            days=999
          else
            days=$(( ( $(date -u -d "$today" +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          fi
          if [ "$days" -ge 2 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Last sent $last, today is $today ($days day(s) ago) — sending every other day. Skipping."
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          node-version: "lts/*"

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: npm ci

      - name: Run the digest
        if: steps.gate.outputs.proceed == 'true'
        env:
          REDDITAPIS_TOKEN: ${{ secrets.REDDITAPIS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_CC: ${{ secrets.DIGEST_CC }}
        run: npm run digest

      # Runners are a fresh VM every time, so both data/seen.json (dedup
      # memory, src/seen.ts) and data/last-sent.txt (the guard above) have to
      # be committed back or every run starts from zero state.
      - name: Save state
        if: steps.gate.outputs.proceed == 'true'
        run: |
          TZ="America/New_York" date +%F > data/last-sent.txt
          git config user.name "hockeygods-scrape bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json data/last-sent.txt
          git diff --cached --quiet || git commit -m "Update digest state [skip ci]"
          git push
